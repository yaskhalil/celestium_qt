name: Weekly Data Ingestion

on:
  schedule:
    # Runs at 00:00 every Saturday
    - cron: '0 0 * * 6'
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v2

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: uv sync

    - name: Run Ingestion
      env:
        DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
      run: |
        PYTHONPATH=. uv run python scripts/ingest_databento.py

    - name: Commit data changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add data/processed/
        git commit -m "chore: update databento dataset [skip ci]" || echo "No changes to commit"
        git push
