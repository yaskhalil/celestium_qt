[project]
name = "celestium_qt"
version = "0.1.0"
description = "Hierarchical Systematic Trading Stack"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "polars",
    "pydantic",
    "xgboost",
    "scipy",
    "structlog",
    "pytest",
    "torch",
    "pydantic-settings>=2.13.1",
    "duckdb",
    "apscheduler",
    "scikit-learn>=1.8.0",
    "httpx>=0.28.1",
    "pyarrow>=24.0.0",
    "databento>=0.76.0",
    "tzdata",
    "rich",
    "mcp<2",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
    "respx>=0.22.0",
]

[tool.uv]
override-dependencies = [
    "grpcio>=1.62.2",
    "grpcio-tools>=1.62.2",
    "protobuf>=5.26.1"
]

[tool.uv.extra-build-dependencies]
grpcio-tools = ["setuptools"]
