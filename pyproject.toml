[project]
name = "celestium_qt"
version = "0.1.0"
description = "Hierarchical Systematic Trading Stack"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "polars",
    "pydantic",
    "xgboost",
    "scipy",
    "structlog",
    "pytest",
    "torch",
    "pydantic-settings>=2.13.1",
    "webull-python-sdk-tpa",
    "pykx",
    "apscheduler",
    "scikit-learn>=1.8.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
    "respx>=0.22.0",
]
